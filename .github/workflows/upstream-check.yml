name: Check upstream for new commits

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coinos/coinos-server.git
          git fetch upstream master

      # Fail the run — rather than filing a GitHub issue — when upstream is
      # ahead of origin/main. Issues are disabled on this fork, so an
      # issue-based tracker 410s outright; a failed scheduled run doesn't
      # depend on that (or any other) repo feature toggle, and GitHub already
      # emails on a failed scheduled workflow by default, which is the actual
      # notification this is for. The tradeoff: it stays red every day the
      # fork is behind, rather than only once — that's an accurate reflection
      # of the state, not a bug.
      - name: Fail if behind upstream
        run: |
          COUNT=$(git rev-list --count origin/main..upstream/master)
          if [ "$COUNT" -eq 0 ]; then
            echo "Up to date with upstream/master."
            exit 0
          fi
          echo "$COUNT commit(s) on coinos/coinos-server master not yet in this fork's main:"
          echo
          git log --pretty=format:'- %h %s (%an, %ad)' --date=short origin/main..upstream/master
          echo
          echo
          echo "Review with: git fetch upstream && git log main..upstream/master"
          exit 1
