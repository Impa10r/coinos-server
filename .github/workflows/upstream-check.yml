name: Check upstream for new commits

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coinos/coinos-server.git
          git fetch upstream master

      # This fork tracks upstream via cherry-pick, not merge, so a raw
      # `git rev-list --count origin/main..upstream/master` is meaningless:
      # cherry-picking rewrites commit SHAs, so a commit already incorporated
      # (by content) still shows up in that diff forever, under its original
      # upstream SHA, even though this fork's version of it has a different
      # SHA. That count is 113 on this repo and will realistically never hit
      # zero — it was a false signal, not a real "commits to review" number.
      #
      # Instead, treat a commit as genuinely new only if its exact commit
      # title has no match anywhere in origin/main's history. git cherry-pick
      # preserves the original subject line by default, so an exact title
      # match reliably means "already incorporated" even when the resulting
      # diff no longer matches the raw upstream patch (surrounding code has
      # since evolved). See CLAUDE.md for the full reasoning and the
      # `--fixed-strings` + `^…$` anchor pitfall (anchors become literal
      # characters under --fixed-strings, silently breaking every match).
      #
      # This still isn't perfect signal: a commit whose content was folded
      # into a differently-titled local commit (independent parallel fix,
      # framework migration that made the upstream patch moot, etc.) has no
      # title match and will show up here as a false "new" — confirmed on
      # this repo for a fastify v4->v5 bump (fastify was since removed
      # entirely) and a cookie-flags fix (already applied under an unrelated
      # commit message). Treat a hit below as "worth a two-minute glance,"
      # not "definitely needs cherry-picking." Once actually verified, add
      # the SHA to .github/upstream-verified-ignore.txt so the same commit
      # doesn't keep re-alerting daily — that file's own header explains the
      # format and the bar for adding an entry.
      - name: Check for genuinely new upstream commits
        run: |
          IGNORE_FILE=".github/upstream-verified-ignore.txt"
          is_ignored() {
            [ -f "$IGNORE_FILE" ] || return 1
            grep -v '^\s*#' "$IGNORE_FILE" | grep -v '^\s*$' | awk '{print $1}' | grep -qx "$1"
          }

          NEW_LOG=""
          while read -r sha; do
            if is_ignored "$sha"; then continue; fi
            title=$(git log -1 --format='%s' "$sha")
            found=0
            while IFS= read -r candidate; do
              if [ "$candidate" = "$title" ]; then
                found=1
                break
              fi
            done < <(git log origin/main --format='%s' --fixed-strings --grep="$title")
            if [ "$found" -eq 0 ]; then
              line=$(git log -1 --pretty=format:'- %h %s (%an, %ad)' --date=short "$sha")
              NEW_LOG="${NEW_LOG}${line}"$'\n'
            fi
          done < <(git rev-list --reverse origin/main..upstream/master)

          if [ -z "$NEW_LOG" ]; then
            echo "Up to date with upstream/master (every upstream commit's title already matches something in this fork's main, even under a different SHA from cherry-picking)."
            exit 0
          fi

          echo "Possibly-new commit(s) on coinos/coinos-server master (no matching title anywhere in this fork's main — some may already be covered under a different commit message; see workflow comments):"
          echo
          printf '%s' "$NEW_LOG"
          echo
          echo "Review with: git fetch upstream && git log main..upstream/master"
          exit 1
